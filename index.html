<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kasa Termy Maltańskie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Saira:wght@500;600;700&display=swap">
<style>
/* Layout: kiosk 1280×960 (4:3) skalowany do okna; pasek górny, kroki, widok, pasek akcji. Barwy z logo Term Maltańskich. */
:root{
  --navy:#15418A; --navy-d:#0E2F66; --sky:#018ED7; --sky-l:#E3F2FB; --ink:#0F2347; --muted:#56678A;
  --bg:#F1F6FB; --surface:#FFFFFF; --line:#D8E3F0; --soft:#E7EFF8;
  --go:#1F9D55; --go-d:#178046; --stop:#D23B3B; --warm:#E07B2E; --yellow:#F5C518;
  --water:linear-gradient(135deg,#0A5DB0 0%,#018ED7 60%,#43B8EC 100%);
  --grad:linear-gradient(90deg,#F6E32F 0%,#F0932E 10%,#E9272A 19%,#E52053 30%,#D42A7C 42%,#7C418B 52%,#0E539E 62%,#1388C6 72%,#10B9DB 82%,#1AB48A 92%,#24B153 100%);
  --f:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --d:"Saira","Poppins",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:#081A3A;overflow:hidden;font-family:var(--f);color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none}
[hidden]{display:none!important}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:960px;transform:translate(-50%,-50%) scale(var(--s,1));background:var(--bg);display:flex;flex-direction:column;overflow:hidden;color:var(--ink)}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation;text-align:inherit}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
button[disabled]{cursor:default}
.num{font-variant-numeric:tabular-nums}
svg.i{width:1.4em;height:1.4em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* chrome */
#top{height:92px;flex:none;background:var(--surface);display:flex;align-items:center;gap:18px;padding:0 28px;border-bottom:4px solid transparent;border-image:var(--water) 1}
#top .logo{height:58px}
.sp{flex:1}
.clock{font-family:var(--d);font-size:2rem;font-weight:600;color:var(--navy)}
.langs{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:2px}
.langs button{min-width:52px;height:46px;border-radius:10px;font-weight:600;color:var(--muted);text-align:center}
.langs button.on{background:var(--surface);color:var(--navy);box-shadow:0 1px 4px rgba(15,35,71,.15)}
.tool{height:54px;padding:0 16px;border-radius:14px;background:var(--soft);display:flex;align-items:center;gap:8px;font-weight:600;color:var(--navy)}
#steps{height:58px;flex:none;display:flex;align-items:center;justify-content:center;gap:10px}
.step{display:flex;align-items:center;gap:10px;font-weight:500;color:var(--muted);white-space:nowrap}
.step i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-weight:600;font-size:.85rem}
.step i svg.i{width:18px;height:18px}
.step.on{color:var(--ink);font-weight:600}.step.on i{background:var(--navy);color:#fff}.step.done i{background:var(--go);color:#fff}
.bar{flex:0 0 48px;height:3px;border-radius:2px;background:var(--line)}.bar.done{background:var(--go)}
#view{flex:1;min-height:0;overflow:auto;padding:6px 32px 18px;display:flex;flex-direction:column;gap:16px}
#bottom{height:104px;flex:none;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 28px;position:relative}
.mid{flex:1;display:flex;justify-content:center;align-items:center;gap:8px;color:var(--muted);font-size:.85rem}
.mid img{height:30px}
.btn{height:72px;padding:0 30px;border-radius:18px;font-weight:600;font-size:1.25rem;display:inline-flex;align-items:center;justify-content:center;gap:10px;white-space:nowrap;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn-go{background:var(--go);color:#fff;min-width:250px;box-shadow:0 6px 16px rgba(31,157,85,.28)}
.btn-go[disabled]{background:#B9C4D6;box-shadow:none}
.btn-ghost{background:var(--soft);color:var(--navy);min-width:170px}
.btn-stop{color:var(--stop);border:2px solid #F2CACA;min-width:150px;font-size:1.05rem;height:60px}
.btn-navy{background:var(--navy);color:#fff}
.scr-start #top,.scr-start #steps,.scr-start #bottom{display:none}
.scr-start #view{padding:0;overflow:hidden}
.scr-print #bottom{visibility:hidden}
.h1{font-family:var(--d);font-size:2.3rem;font-weight:700;margin:0;letter-spacing:-.3px;color:var(--navy);line-height:1.05}
.sub{color:var(--muted);font-size:1.05rem;margin:4px 0 0}
.lbl{font-size:.76rem;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 12px;border-radius:14px;font-size:.8rem;font-weight:600;white-space:nowrap}

/* START */
.start{height:100%;display:grid;grid-template-columns:1fr 520px;background:var(--surface);position:relative}
.start-l{padding:48px 60px;display:flex;flex-direction:column}
.start-l .logo{height:120px;align-self:flex-start}
.hero{margin-top:60px;font-family:var(--d);font-size:4.6rem;font-weight:700;line-height:.98;color:var(--navy);letter-spacing:-1px}
.hero span{color:var(--sky)}
.lead{font-size:1.25rem;color:var(--muted);margin-top:18px;max-width:520px;line-height:1.45}
.cta{margin-top:36px;align-self:flex-start;height:100px;padding:0 46px 0 28px;border-radius:26px;background:var(--navy);color:#fff;font-size:1.65rem;font-weight:600;display:flex;align-items:center;gap:20px;box-shadow:0 14px 30px rgba(21,65,138,.3)}
.cta .ring{width:60px;height:60px;border-radius:18px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.cta .ring .i{width:32px;height:32px}
.sfoot{margin-top:auto;display:flex;align-items:center;gap:8px}
.sfoot button{height:58px;padding:0 16px;border-radius:14px;background:var(--soft);font-weight:600;color:var(--muted)}
.sfoot button.on{background:var(--navy);color:#fff}
.sfoot img{height:34px;margin-left:auto}
.water{background:var(--water);color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:44px 40px}
.water svg.waves{position:absolute;left:0;right:0;top:0;width:100%;height:auto;opacity:.18}
.water h3{margin:0 0 6px;font-family:var(--d);font-size:1.6rem;font-weight:600}
.hours{display:flex;flex-direction:column;gap:2px;position:relative}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.25);font-size:1.08rem}
.hrow b{font-family:var(--d);font-size:1.5rem;font-weight:600}
.open{margin-top:22px;display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.16);border-radius:14px;padding:12px 16px;font-weight:600;position:relative;align-self:flex-start}
.open i{width:12px;height:12px;border-radius:50%;background:#7CF0A6;box-shadow:0 0 0 4px rgba(124,240,166,.3)}
.fs{position:absolute;right:16px;top:16px;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center;z-index:2}

/* kafle wyboru */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;flex:1;min-height:0}
.tile{background:var(--surface);border-radius:24px;display:grid;grid-template-columns:150px 1fr;overflow:hidden;border:3px solid transparent;transition:transform .08s,border-color .15s;box-shadow:0 2px 6px rgba(15,35,71,.06)}
.tile:active{transform:scale(.98)}
.tile.on{border-color:var(--navy)}
.tile .art{background:var(--c);display:grid;place-items:center}
.tile .art svg{width:92px;height:92px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile .b{padding:22px 24px;display:flex;flex-direction:column;gap:6px}
.tile .n{font-family:var(--d);font-size:1.75rem;font-weight:700;color:var(--navy);line-height:1.05}
.tile .d{color:var(--muted);font-size:.95rem;line-height:1.35}
.tile .p{margin-top:auto;display:flex;align-items:baseline;gap:6px;color:var(--muted);font-size:.9rem}
.tile .p b{font-family:var(--d);font-size:1.8rem;color:var(--ink);font-weight:700}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;flex:1;min-height:0}
.time{background:var(--surface);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;border:3px solid transparent;box-shadow:0 2px 6px rgba(15,35,71,.06);position:relative}
.time:active{transform:scale(.98)}
.time .dial{width:120px;height:120px}
.time .n{font-family:var(--d);font-size:2.2rem;font-weight:700;color:var(--navy)}
.time .till{color:var(--muted);font-size:.95rem}
.time .p{font-family:var(--d);font-size:2rem;font-weight:700}
.time .tag{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--sky-l);color:var(--navy)}
.note{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:14px 18px;color:var(--muted);font-size:.95rem}
.note .i{color:var(--sky)}

/* osoby */
.pax{display:grid;grid-template-columns:1fr 360px;gap:16px;flex:1;min-height:0}
.pmain{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
.prow{background:var(--surface);border-radius:18px;display:grid;grid-template-columns:56px 1fr auto 220px;align-items:center;gap:16px;padding:10px 12px 10px 14px;min-height:66px;flex:none}
.prow.on{box-shadow:inset 0 0 0 2px var(--navy)}
.prow .pic{width:50px;height:50px;border-radius:16px;background:var(--sky-l);color:var(--navy);display:grid;place-items:center}
.prow.on .pic{background:var(--navy);color:#fff}
.prow .n{font-size:1.15rem;font-weight:600}
.prow .n small{display:block;font-size:.82rem;font-weight:400;color:var(--muted)}
.prow .pp{font-family:var(--d);font-weight:600;font-size:1.25rem;color:var(--muted)}
.ctr{display:grid;grid-template-columns:72px 1fr 72px;align-items:center;gap:6px}
.ctr button{height:54px;border-radius:14px;background:var(--soft);color:var(--navy);display:grid;place-items:center}
.ctr button.plus{background:var(--navy);color:#fff}
.ctr button[disabled]{opacity:.35}
.ctr b{text-align:center;font-family:var(--d);font-size:1.9rem;font-weight:700}
.grp{display:flex;align-items:center;gap:14px;border-radius:18px;padding:10px 18px;background:var(--surface);border:2px dashed var(--line);color:var(--muted);flex:none}
.grp.on{border:2px solid var(--go);background:#E9F7EF;color:var(--go-d);font-weight:600}
.sum{background:var(--surface);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:12px;min-height:0}
.sum .z{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:14px;padding:12px}
.sum .z i{width:44px;height:44px;border-radius:12px;background:var(--c);display:grid;place-items:center;flex:none}
.sum .z i svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sum .z b{display:block}.sum .z span{font-size:.85rem;color:var(--muted)}
.lines{display:flex;flex-direction:column;gap:8px;font-size:.98rem}
.lines div{display:flex;justify-content:space-between;gap:10px}
.lines div span:last-child{font-weight:600;white-space:nowrap}
.lines .disc{color:var(--go-d)}
.total{margin-top:auto;border-top:2px dashed var(--line);padding-top:12px;display:flex;justify-content:space-between;align-items:baseline}
.total b{font-family:var(--d);font-size:2.4rem;font-weight:700;color:var(--navy)}

/* płatność */
.pay{display:grid;grid-template-columns:320px 1fr;gap:16px;flex:1;min-height:0;padding-right:96px}
.payR{display:flex;flex-direction:column;gap:12px;min-height:0;position:relative}
.payhead{display:flex;align-items:flex-end;gap:16px}
.payhead .due{margin-left:auto;text-align:right}
.payhead .due b{display:block;font-family:var(--d);font-size:2.4rem;font-weight:700;color:var(--navy);line-height:1}
.pcols{display:grid;grid-template-columns:1fr 34px 1fr;gap:8px;flex:1;min-height:0}
.or{display:flex;align-items:center;justify-content:center;position:relative}
.or::before{content:"";position:absolute;top:8%;bottom:8%;left:50%;border-left:2px dashed var(--line)}
.or i{position:relative;font-style:normal;background:var(--bg);color:var(--muted);font-weight:700;font-size:.78rem;text-transform:uppercase;padding:8px 0}
.pcol{background:var(--surface);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;transition:opacity .2s}
.pcol.off{opacity:.35;pointer-events:none}
.pcol h3{margin:0;font-size:1.3rem;font-weight:600}
.pbig{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;color:#fff}
.pbig .i{width:34px;height:34px}
.blik{font-weight:800;font-style:normal;font-size:1.25rem;letter-spacing:-.5px}
.how{font-size:.9rem;color:var(--muted);line-height:1.35}
.mach{width:64px;height:104px;flex:none}
.mhl{fill:#F5C518;animation:hl 1.3s ease-in-out infinite}.mhl-t{animation:hl 1.3s ease-in-out infinite}
@keyframes hl{50%{opacity:.35}}
.brands{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.brands span{height:28px;padding:0 10px;border-radius:8px;background:var(--soft);font-size:.74rem;font-weight:600;display:flex;align-items:center}
.toterm{margin-top:auto;width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;background:var(--navy);color:#fff;border-radius:14px;padding:14px 16px;font-weight:600;font-size:.95rem;text-align:left}
.arr{display:flex}.arr .i{width:22px;height:22px;margin-left:-8px;animation:nudge 1.2s ease-in-out infinite}
.arr .i:nth-child(2){animation-delay:.15s}.arr .i:nth-child(3){animation-delay:.3s}
@keyframes nudge{0%,100%{opacity:.25;transform:translateX(0)}50%{opacity:1;transform:translateX(4px)}}
.blikbtn{margin-top:auto;width:100%;height:76px}
.denoms{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.denoms b{color:var(--ink)}
.cashbar{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.8rem;color:var(--muted);width:100%}
.cashbar b{display:block;font-family:var(--d);font-size:1.3rem;color:var(--ink);white-space:nowrap}
.cashbar .left b{color:var(--stop)}
.blikpanel{flex:1;background:var(--surface);border-radius:20px;padding:22px 28px;display:flex;flex-direction:column;gap:16px;align-items:center}
.codes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:440px}
.codes i{height:66px;border-radius:12px;background:var(--bg);border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:2rem;font-weight:700}
.codes i.f{border-color:var(--navy)}
.pad{display:grid;grid-template-columns:repeat(3,120px);gap:8px}
.pad button{height:62px;border-radius:12px;background:var(--soft);font-size:1.4rem;font-weight:600;color:var(--navy);display:grid;place-items:center}
.pad .ok{background:var(--go);color:#fff;font-size:1rem}.pad .ok[disabled]{background:#C3CADB}
.linkback{display:flex;align-items:center;gap:8px;color:var(--navy);font-weight:600;height:52px;padding:0 16px;border-radius:12px;background:var(--soft)}
.termhint{position:absolute;right:0;top:50%;transform:translateY(-50%);background:var(--navy);color:#fff;border-radius:18px 0 0 18px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:600;font-size:.78rem;width:92px;box-sizing:border-box;text-align:center;z-index:5}
.termhint .i:last-child{width:30px;height:30px;animation:nudge 1.2s ease-in-out infinite}
.overlay{position:absolute;inset:0;background:rgba(241,246,251,.93);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:3}
.spin{width:64px;height:64px;border-radius:50%;border:6px solid var(--soft);border-top-color:var(--navy);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* druk + bilet */
.print{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.slot{width:300px;height:22px;border-radius:12px;background:var(--ink);position:relative}
.paper{position:absolute;left:40px;right:40px;top:11px;height:0;background:#fff;border-radius:0 0 8px 8px;box-shadow:0 10px 20px rgba(15,35,71,.15);overflow:hidden;animation:paper 2.4s ease-in-out forwards}
.paper::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--water)}
@keyframes paper{to{height:240px}}
.donev{display:grid;grid-template-columns:1fr 340px;gap:24px;flex:1;min-height:0;align-items:start}
.okc{background:var(--surface);border-radius:22px;padding:30px 34px;display:flex;flex-direction:column;gap:14px;height:100%;box-sizing:border-box}
.ok-ic{width:76px;height:76px;border-radius:22px;background:var(--go);color:#fff;display:grid;place-items:center}
.ok-ic .i{width:44px;height:44px;stroke-width:2.6}
.rules{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.rules div{display:flex;gap:12px;align-items:center;font-size:1.02rem}
.rules .i{color:var(--sky);width:28px;height:28px}
.tk{background:#fff;border-radius:6px;box-shadow:0 10px 28px rgba(15,35,71,.16);padding:18px 18px 14px;font-size:13px;line-height:1.35;position:relative}
.tk::before,.tk::after{content:"";position:absolute;left:0;right:0;height:8px;background:radial-gradient(circle at 6px -2px,transparent 6px,#fff 6.5px) repeat-x;background-size:12px 8px}
.tk::before{top:-7px;transform:scaleY(-1)}.tk::after{bottom:-7px}
.tk .lg{display:block;height:44px;margin:0 auto 8px}
.tk .ttl{text-align:center;font-family:var(--d);font-weight:700;font-size:1.1rem;letter-spacing:1px;color:var(--navy);border-bottom:1px dashed #9AA8C2;padding-bottom:8px}
.tk .zone{display:flex;align-items:center;gap:10px;margin:10px 0}
.tk .zone i{width:36px;height:36px;border-radius:10px;background:var(--c);display:grid;place-items:center;flex:none}
.tk .zone i svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tk .zone b{font-size:15px;display:block}
.tk .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.tk .kv span:nth-child(even){text-align:right;font-weight:600}
.tk .sep{border-top:1px dashed #9AA8C2;margin:8px 0}
.tk .qr{width:150px;height:150px;margin:8px auto 4px;display:block}
.tk .no{text-align:center;font-family:ui-monospace,monospace;font-size:12px;letter-spacing:1px}
.tk .ft{text-align:center;font-size:11px;color:#56678A;margin-top:6px}

/* modale */
#modal{position:absolute;inset:0;background:rgba(8,26,58,.55);display:grid;place-items:center;z-index:20}
.mbox{background:var(--surface);border-radius:28px;padding:30px;width:620px;display:flex;flex-direction:column;gap:18px}
.acts{display:flex;gap:12px;justify-content:flex-end}
.helpnum{font-family:var(--d);font-size:2.8rem;font-weight:700;color:var(--navy)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="stage">
  <header id="top"></header>
  <nav id="steps"></nav>
  <main id="view"></main>
  <footer id="bottom"></footer>
  <div id="modal" hidden></div>
</div>

 fam4:'<circle cx="5" cy="6" r="2.2"/><circle cx="19" cy="6" r="2.2"/><circle cx="10" cy="12" r="1.8"/><circle cx="14" cy="12" r="1.8"/><path d="M2 20v-5a3 3 0 0 1 6 0v5M16 20v-5a3 3 0 0 1 6 0v5M8 20v-3a2 2 0 0 1 4 0M12 17a2 2 0 0 1 4 0v3"/>',
 qr:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/>',
 gate:'<path d="M4 21V5M20 21V5M4 12h16M8 12V8M12 12V8M16 12V8"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
const money=v=>v.toFixed(2).replace('.',',')+' zł';
const r2=v=>Math.round(v*100)/100;
const now=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const hm=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const CLOSE=23*60;

/* ===== stan ===== */
let S;const fresh=l=>({lang:l||'pl',screen:'start',zone:null,time:null,pax:{n:1},phase:null,payBy:null,blik:'',blikOpen:false,cashIn:0,no:null,modal:null});
S=fresh();
const zone=()=>ZONES.find(z=>z.id===S.zone);
const tIdx=()=>TIMES.findIndex(x=>x.h===S.time);
const base=()=>zone().p[tIdx()];
const persons=()=>CATS.reduce((a,c)=>a+(S.pax[c.id]||0)*(c.persons||1),0);
const sub=()=>r2(CATS.reduce((a,c)=>a+(S.pax[c.id]||0)*r2(base()*c.m),0));
const isGroup=()=>persons()>=GROUP_MIN;
const total=()=>r2(sub()*(isGroup()?1-GROUP_DISC:1));
const until=h=>h?Math.min(now()+h*60,CLOSE):CLOSE;

/* ===== widoki ===== */
function topHTML(){return `<img class="logo" src="${LOGOS.TM}" alt="Termy Maltańskie"><span class="sp"></span><span class="clock num" data-clock>${hm(now())}</span>
 <div class="langs">${LANGS.map(l=>`<button data-a="lang" data-v="${l}" class="${S.lang===l?'on':''}">${LS[l]}</button>`).join('')}</div>
 <button class="tool" data-a="help">${ic('help')}${t('help')}</button>`}
const STEPS=['zone','time','pax','pay','done'];
function stepsHTML(){const i=S.screen==='print'?4:STEPS.indexOf(S.screen);return['s1','s2','s3','s4','s5'].map((k,n)=>(n?`<span class="bar ${n<=i?'done':''}"></span>`:'')+`<span class="step ${n===i?'on':n<i?'done':''}"><i>${n<i?ic('check'):n+1}</i>${t(k)}</span>`).join('')}
function bottomHTML(){
 if(S.screen==='done')return `<button class="btn btn-ghost" data-a="reset">${t('finish')}</button><div class="mid num" data-autoback></div><button class="btn btn-go" data-a="again">${t('another')}</button>`;
 if(S.screen==='print')return '';
 const next=S.screen==='pax'?`<button class="btn btn-go" data-a="next" ${persons()?'':'disabled'}>${t('next')} · <span class="num">${money(total())}</span>${ic('arrow')}</button>`:'';
 return `<button class="btn btn-stop" data-a="cancel">${ic('x')}${t('cancel')}</button><div class="mid">${S.screen==='pax'&&!persons()?t('addPax'):`<img src="${LOGOS.AV}" alt="Avista">`}</div><button class="btn btn-ghost" data-a="back">${ic('back')}${t('back')}</button>${next}`;
}
const V={};
const WAVES=`<svg class="waves" viewBox="0 0 520 300" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40c60 30 120 30 180 0s120-30 180 0 120 30 160 10v20c-40 20-100 10-160-10s-120-30-180 0S60 90 0 60z" fill="#fff"/><path d="M0 120c60 30 120 30 180 0s120-30 180 0 120 30 160 10v14c-40 20-100 10-160-10s-120-30-180 0-120 30-180 0z" fill="#fff"/><path d="M0 200c60 30 120 30 180 0s120-30 180 0 120 30 160 10v10c-40 20-100 10-160-10s-120-30-180 0-120 30-180 0z" fill="#fff"/></svg>`;
V.start=()=>`<div class="start"><div class="start-l">
  <img class="logo" src="${LOGOS.TM}" alt="Termy Maltańskie Poznań">
  <div class="hero">${t('hero')}</div><p class="lead">${t('lead')}</p>
  <button class="cta" data-a="begin"><span class="ring">${ic('tap')}</span>${t('touch')}</button>
  <div class="sfoot">${LANGS.map(l=>`<button data-a="lang" data-v="${l}" class="${S.lang===l?'on':''}">${LN[l]}</button>`).join('')}<img src="${LOGOS.AV}" alt="Avista"></div></div>
 <div class="water">${WAVES}<button class="fs" data-a="fs" aria-label="Pełny ekran">${ic('fs')}</button>
  <h3>${t('today')}</h3><div class="hours">${ZONES.slice(0,3).map(z=>`<div class="hrow"><span>${t('z'+z.id)}</span><b class="num">${z.id==='spo'?'6:00':'8:00'}–23:00</b></div>`).join('')}</div>
  <span class="open"><i></i>${t('openNow')} · <span class="num" data-clock>${hm(now())}</span></span></div></div>`;
V.zone=()=>`<div><h1 class="h1">${t('qZone')}</h1><p class="sub">${t('qZoneS')}</p></div>
 <div class="tiles">${ZONES.map(z=>`<button class="tile ${S.zone===z.id?'on':''}" style="--c:${z.c}" data-a="zone" data-v="${z.id}"><span class="art"><svg viewBox="0 0 48 48" aria-hidden="true">${z.art}</svg></span>
  <span class="b"><span class="n">${t('z'+z.id)}</span><span class="d">${t('d'+z.id)}</span><span class="p">${t('from')} <b class="num">${money(z.p[0])}</b>/ 1 h</span></span></button>`).join('')}</div>`;
function dial(h){const f=h?h/4:1,a=f*2*Math.PI,x=60+48*Math.sin(a),y=60-48*Math.cos(a),large=f>.5?1:0;
 const arc=h?`<path d="M60 12 A48 48 0 ${large} 1 ${x.toFixed(1)} ${y.toFixed(1)} L60 60Z" fill="var(--sky)" opacity=".85"/>`:`<circle cx="60" cy="60" r="48" fill="var(--sky)" opacity=".85"/>`;
 return `<svg class="dial" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" fill="var(--sky-l)"/>${arc}<circle cx="60" cy="60" r="54" fill="none" stroke="var(--navy)" stroke-width="4"/><circle cx="60" cy="60" r="5" fill="var(--navy)"/></svg>`}
V.time=()=>`<div><h1 class="h1">${t('qTime')}</h1><p class="sub">${t('z'+S.zone)} · ${t('qTimeS')}</p></div>
 <div class="times">${TIMES.map((x,i)=>`<button class="time" data-a="time" data-v="${x.h}">${i===1?`<span class="pill tag">${t('popular')}</span>`:''}${dial(x.h)}<span class="n">${t('h'+x.h)}</span><span class="till num">${t('till')} ${hm(until(x.h))}</span><span class="p num">${money(zone().p[i])}</span></button>`).join('')}</div>
 <div class="note">${ic('clock')}${t('over')}</div>`;
function sumHTML(){const z=zone();return `<div class="sum"><span class="lbl">${t('sum')}</span>
 <div class="z" style="--c:${z.c}"><i><svg viewBox="0 0 48 48">${z.art}</svg></i><div><b>${t('z'+z.id)}</b><span class="num">${t('h'+S.time)} · ${hm(now())}–${hm(until(S.time))}</span></div></div>
 <div class="lines num">${CATS.filter(c=>S.pax[c.id]).map(c=>`<div><span>${S.pax[c.id]}× ${t('c'+c.id)}</span><span>${money(S.pax[c.id]*r2(base()*c.m))}</span></div>`).join('')}
 ${isGroup()?`<div class="disc"><span>${t('groupDisc')}</span><span>−${money(r2(sub()-total()))}</span></div>`:''}</div>
 <div class="total"><span style="font-weight:600">${t('total')}</span><b class="num">${money(total())}</b></div></div>`}
V.pax=()=>`<div class="pax"><div class="pmain"><h1 class="h1">${t('qPax')}</h1>
 ${CATS.map(c=>{const n=S.pax[c.id]||0;return `<div class="prow ${n?'on':''}"><span class="pic">${ic(c.pic)}</span><span class="n">${t('c'+c.id)}<small>${t('d'+c.id)}</small></span><span class="pp num">${money(r2(base()*c.m))}</span>
  <div class="ctr"><button data-a="dec" data-v="${c.id}" ${n?'':'disabled'} aria-label="−">${ic('minus')}</button><b class="num">${n}</b><button class="plus" data-a="inc" data-v="${c.id}" aria-label="+">${ic('plus')}</button></div></div>`}).join('')}
 <div class="grp ${isGroup()?'on':''}">${ic('family')}<span>${isGroup()?`${t('grpOn')} ${persons()} ${t('persons')}`:t('grpOff')}</span></div></div>${sumHTML()}</div>`;
function machineSVG(part){const hl=x=>part===x||(part==='cash'&&(x==='coin'||x==='note'))?'class="mhl"':'fill="#C9D4E4"';
 return `<svg class="mach" viewBox="0 0 64 104" aria-hidden="true"><rect x="4" y="2" width="56" height="100" rx="8" fill="#F1F6FB" stroke="#15418A" stroke-width="2.5"/><rect x="10" y="8" width="44" height="30" rx="3" fill="#15418A"/><rect x="38" y="44" width="16" height="12" rx="2" ${hl('reader')}/><rect x="12" y="46" width="18" height="4" rx="2" ${hl('coin')}/><rect x="10" y="60" width="44" height="4" rx="2" ${hl('note')}/><rect x="14" y="78" width="36" height="14" rx="3" ${hl('tray')}/></svg>`}
const phoneSVG=()=>`<svg class="mach" viewBox="0 0 64 104" aria-hidden="true"><rect x="12" y="6" width="40" height="92" rx="8" fill="#F1F6FB" stroke="#15418A" stroke-width="2.5"/><rect x="17" y="16" width="30" height="66" rx="3" fill="#111"/><text x="32" y="44" text-anchor="middle" fill="#fff" font-family="Poppins,sans-serif" font-weight="800" font-size="10">blik</text><g class="mhl-t"><rect x="19" y="54" width="26" height="10" rx="2" fill="#F5C518"/><text x="32" y="61.5" text-anchor="middle" fill="#111" font-family="monospace" font-weight="600" font-size="6.5">123 456</text></g></svg>`;
V.pay=()=>{
 const cashOn=false;
 const ov=S.phase==='wait'?`<div class="overlay"><div class="spin"></div><span class="h1" style="font-size:1.6rem">${S.payBy==='blik'?t('blikConf'):S.payBy==='cash'?t('cashOk'):t('auth')}</span></div>`:'';
 const head=`<div class="payhead"><div><h1 class="h1">${S.blikOpen?'BLIK':t('payQ')}</h1>${S.blikOpen?'':`<p class="sub">${t('payS')}</p>`}</div><div class="due"><span class="lbl">${t('toPay')}</span><b class="num">${money(total())}</b></div></div>`;
 const or=`<span class="or"><i>${t('or')}</i></span>`;
 const body=S.blikOpen?`<div class="blikpanel"><span class="how" style="font-size:1.05rem">${t('blikHow2')}</span><div class="codes num">${Array.from({length:6},(_,i)=>`<i class="${i===S.blik.length?'f':''}">${S.blik[i]||''}</i>`).join('')}</div>
   <div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-a="blik" data-v="${d}">${d}</button>`).join('')}<button data-a="blikDel">${ic('del')}</button><button data-a="blik" data-v="0">0</button><button class="ok" data-a="blikOk" ${S.blik.length===6?'':'disabled'}>${t('payBtn')}</button></div>
   <button class="linkback" data-a="blikClose">${ic('back')}${t('other')}</button></div>`
 :`<div class="pcols">
   <button class="pcol ${cashOn?'off':''}" data-a="card"><span class="pbig" style="background:var(--navy)">${ic('card')}</span><h3>${t('card')}</h3><span class="how">${t('cardHow')}</span>${machineSVG('reader')}
    <span class="brands"><span>Visa</span><span>Mastercard</span><span>Apple Pay</span><span>Google Pay</span></span><span class="toterm">${t('term')}<span class="arr">${ic('arrow')}${ic('arrow')}${ic('arrow')}</span></span></button>${or}
   <div class="pcol ${cashOn?'off':''}"><span class="pbig" style="background:#111"><i class="blik">blik</i></span><h3>BLIK</h3><span class="how">${t('blikHow')}</span>${phoneSVG()}<button class="btn btn-navy blikbtn" data-a="blikOpen">${ic('kbd')}${t('blikStart')}</button></div></div>`;
 return `<div class="pay">${sumHTML()}<div class="payR">${head}${body}${ov}</div></div>${S.blikOpen||cashOn?'':`<div class="termhint">${ic('card')}<span>${t('term')}</span>${ic('arrow')}</div>`}`;
};
V.print=()=>`<div class="print"><div class="slot"><div class="paper"></div></div><div style="height:240px"></div><span class="h1">${t('printing')}</span></div>`;
function qrSVG(txt){let n,dark;try{const q=qrcode(0,'M');q.addData(txt);q.make();n=q.getModuleCount();dark=(r,c)=>q.isDark(r,c)}catch(e){n=QR_FALLBACK.n;dark=(r,c)=>QR_FALLBACK.m[r][c]==='1'}
 let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(dark(r,c))d+=`M${c},${r}h1v1h-1z`;
 return `<svg class="qr" viewBox="-1 -1 ${n+2} ${n+2}" shape-rendering="crispEdges" role="img" aria-label="QR"><rect x="-1" y="-1" width="${n+2}" height="${n+2}" fill="#fff"/><path d="${d}" fill="#0F2347"/></svg>`}
function ticketHTML(){const z=zone(),d=new Date();const ds=String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
 return `<div class="tk"><img class="lg" src="${LOGOS.TM}" alt="Termy Maltańskie"><div class="ttl">BILET WSTĘPU</div>
 <div class="zone" style="--c:${z.c}"><i><svg viewBox="0 0 48 48">${z.art}</svg></i><div><b>${t('z'+z.id)}</b><span class="num">${t('h'+S.time)}</span></div></div>
 <div class="kv num"><span>Data</span><span>${ds}</span><span>Wejście od</span><span>${hm(now())}</span><span>Ważny do</span><span>${hm(until(S.time))}</span><span>Osoby</span><span>${persons()}</span>
 ${CATS.filter(c=>S.pax[c.id]).map(c=>`<span>${S.pax[c.id]}× ${TX['c'+c.id][0]}</span><span>${money(S.pax[c.id]*r2(base()*c.m))}</span>`).join('')}
 ${isGroup()?`<span>Rabat grupowy</span><span>−15%</span>`:''}<span>Razem</span><span>${money(total())}</span><span>Płatność</span><span>${{card:'KARTA',blik:'BLIK'}[S.payBy]}</span></div>
 <div class="sep"></div>${qrSVG('TM|'+S.no+'|'+S.zone+'|'+S.time+'|'+persons())}<div class="no">${S.no}</div>
 <div class="ft">Dopłata ${OVER} zł za każde rozpoczęte 15 min ponad czas.<br>Kasa ${MACHINE} · Avista</div></div>`}
V.done=()=>{const ch=0;return `<div class="donev"><div class="okc"><span class="ok-ic">${ic('check')}</span><h1 class="h1" style="font-size:2.6rem">${t('doneT')}</h1><p class="sub" style="font-size:1.15rem">${t('doneS')}</p>
 ${ch>0?`<span class="pill" style="background:#E9F7EF;color:var(--go-d);height:40px;font-size:1rem;align-self:flex-start">${t('change')}: ${money(ch)}</span>`:''}
 <div class="rules">${[['qr','r1'],['gate','r2'],['lock','r3'],['clock','over']].map(([i,k])=>`<div>${ic(i)}<span>${t(k)}</span></div>`).join('')}</div></div>${ticketHTML()}</div>`};
function modalHTML(){const m=S.modal;if(!m)return'';
 if(m==='cancel')return `<div class="mbox"><h2 class="h1">${t('cancelQ')}</h2><div class="acts"><button class="btn btn-ghost" data-a="mclose">${t('keep')}</button><button class="btn btn-navy" style="background:var(--stop)" data-a="reset">${t('cancelYes')}</button></div></div>`;
 if(m==='help')return `<div class="mbox"><h2 class="h1">${t('helpT')}</h2><p class="sub">${t('helpS')}</p><span class="helpnum num">222 629 629</span><div class="acts"><button class="btn btn-navy" data-a="mclose">${t('close')}</button></div></div>`;
 return `<div class="mbox"><h2 class="h1">${t('still')}</h2><p class="sub num" data-cd>${m.left} s</p><div class="acts"><button class="btn btn-ghost" data-a="reset">${t('cancel')}</button><button class="btn btn-go" data-a="mclose">${t('stillYes')}</button></div></div>`}

/* ===== render i akcje ===== */
function render(){$('#stage').className='scr-'+S.screen;const st=S.screen==='start';
 $('#top').innerHTML=st?'':topHTML();$('#steps').innerHTML=st?'':stepsHTML();$('#view').innerHTML=V[S.screen]();$('#bottom').innerHTML=st?'':bottomHTML();renderModal()}
function renderModal(){$('#modal').innerHTML=modalHTML();$('#modal').hidden=!S.modal}
function go(s){S.screen=s;idle=0;render()}
let timers=[],ab=null;
function paid(by){S.payBy=by;S.phase='wait';render();timers.push(setTimeout(()=>{S.phase=null;S.no='TM'+String(Math.floor(Math.random()*1e8)).padStart(8,'0');go('print');timers.push(setTimeout(()=>{go('done');autoBack()},2600))},by==='blik'?2400:1600))}
function autoBack(){let l=45;const tick=()=>{const el=document.querySelector('[data-autoback]');if(el)el.textContent=t('autoBack')+' '+l+' s';if(l--<=0)reset()};clearInterval(ab);tick();ab=setInterval(()=>{if(S.screen!=='done'){clearInterval(ab);return}tick()},1000)}
function reset(){timers.forEach(clearTimeout);timers=[];clearInterval(ab);S=fresh();go('start')}
function act(a,v){switch(a){
 case 'lang':S.lang=v;render();break;
 case 'begin':go('zone');break;
 case 'help':S.modal='help';renderModal();break;
 case 'cancel':S.modal='cancel';renderModal();break;
 case 'mclose':S.modal=null;renderModal();idle=0;break;
 case 'reset':reset();break;
 case 'fs':try{const p=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();p&&p.catch&&p.catch(()=>{})}catch(e){}break;
 case 'zone':S.zone=v;go('time');break;
 case 'time':S.time=+v;go('pax');break;
 case 'inc':S.pax[v]=(S.pax[v]||0)+1;render();break;
 case 'dec':S.pax[v]=Math.max(0,(S.pax[v]||0)-1);render();break;
 case 'next':if(persons())go('pay');break;
 case 'back':{if(S.screen==='pay'){if(S.cashIn)break;if(S.blikOpen){S.blikOpen=false;S.blik='';render();break}}const i=STEPS.indexOf(S.screen);go(i>0?STEPS[i-1]:'start');}break;
 case 'card':if(!S.phase&&!S.cashIn)paid('card');break;
 case 'blikOpen':S.blikOpen=true;S.blik='';render();break;
 case 'blikClose':S.blikOpen=false;S.blik='';render();break;
 case 'blik':if(S.blik.length<6){S.blik+=v;render()}break;
 case 'blikDel':S.blik=S.blik.slice(0,-1);render();break;
 case 'blikOk':if(S.blik.length===6)paid('blik');break;
 case 'again':{const l=S.lang;timers.forEach(clearTimeout);clearInterval(ab);S=fresh(l);go('zone')}break;
}}
$('#stage').addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;if(S.modal&&!el.closest('#modal'))return;if(S.phase==='wait')return;act(el.dataset.a,el.dataset.v)});
let idle=0;
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{idle=0;if(S.modal&&S.modal.left!==undefined){S.modal=null;renderModal()}},true));
setInterval(()=>{if(['start','print','done'].includes(S.screen)||S.phase){idle=0;return}idle++;
 if(idle===60&&!S.modal){S.modal={left:20};renderModal()}
 if(S.modal&&S.modal.left!==undefined){S.modal.left=Math.max(0,80-idle);const el=document.querySelector('[data-cd]');if(el)el.textContent=S.modal.left+' s';if(!S.modal.left)reset()}},1000);
setInterval(()=>document.querySelectorAll('[data-clock]').forEach(el=>el.textContent=hm(now())),5000);
function fit(){$('#stage').style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/960))}
addEventListener('resize',fit);fit();
addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F')act('fs')});
render();
</script>

</body>
</html>
